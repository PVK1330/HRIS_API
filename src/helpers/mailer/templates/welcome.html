<h2 style="margin:0 0 16px 0;color:#111827;font-size:22px;font-weight:700;">Welcome, {{admin_name}}!</h2>

<p style="margin:0 0 16px 0;color:#374151;line-height:1.6;">
  Your admin account on <strong>{{app_name}}</strong> has been created successfully.
</p>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;margin:20px 0;background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;">
  <tr>
    <td style="padding:14px 16px;color:#6b7280;width:160px;font-size:13px;border-bottom:1px solid #e5e7eb;">Email</td>
    <td style="padding:14px 16px;color:#111827;font-weight:600;font-size:14px;border-bottom:1px solid #e5e7eb;">{{admin_email}}</td>
  </tr>
  <tr>
    <td style="padding:14px 16px;color:#6b7280;font-size:13px;">Temporary Password</td>
    <td style="padding:14px 16px;color:#111827;font-weight:600;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:14px;">{{admin_password}}</td>
  </tr>
</table>

<p style="margin:24px 0 8px 0;text-align:center;">
  <a href="{{login_url}}"
     style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:14px;">
    Login to your account
  </a>
</p>

<p style="margin:24px 0 0 0;color:#6b7280;font-size:13px;line-height:1.6;">
  For your security, please log in and change your password immediately.
</p>
