<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f9f9f9; }
        .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .header { background-color: #0F766E; padding: 40px 20px; text-align: center; }
        .header img { height: 50px; }
        .content { padding: 40px; }
        .footer { background-color: #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #64748b; }
        .button { display: inline-block; padding: 12px 24px; background-color: #0F766E; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
        .otp-box { background: #f0fdfa; padding: 30px; text-align: center; border-radius: 12px; margin: 24px 0; border: 1px dashed #2dd4bf; }
        .otp-code { font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #0F766E; }
        h2 { color: #0f172a; margin-top: 0; font-weight: 800; }
        p { color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- In production, this should be an absolute URL -->
            <img src="{{logoUrl}}" alt="HRIS Logo">
        </div>
        <div class="content">
            {{content}}
        </div>
        <div class="footer">
            <p>&copy; 2026 HRIS. All rights reserved.</p>
            <p>You received this email because you are a registered user of our HR platform.</p>
        </div>
    </div>
</body>
</html>
